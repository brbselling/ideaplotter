<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>IdeaPlotter map</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#eee;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#bar{position:fixed;top:0;left:0;right:0;padding:6px;display:flex;gap:6px;background:#111c}
#q{flex:1;font-size:16px;padding:6px;border-radius:6px;border:0}
#hits{position:fixed;top:44px;left:6px;right:6px;max-height:40vh;overflow:auto;background:#222;border-radius:6px;display:none}
#hits div{padding:8px;border-bottom:1px solid #333}
#card{position:fixed;left:6px;right:6px;bottom:6px;background:#222;border-radius:8px;padding:10px;display:none;max-height:45vh;overflow:auto}
#card a{color:#8cf}#card .nb{padding:4px 0;border-bottom:1px solid #333}
#info{position:fixed;right:8px;top:48px;font-size:11px;color:#aaa}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"><input id="q" placeholder="search a game" autocomplete="off"></div>
<div id="hits"></div><div id="card"></div><div id="info"></div>
<script>
// Data files (made by the pipeline's make_map.py): meta.json, xy.bin (float32 x,y), cl.bin (uint16), nn.bin (int32 x5), names.json
const cv=document.getElementById('c'),cx=cv.getContext('2d');let M,XY,CL,NN,NM,N;
let sc=1,ox=0,oy=0,sel=-1,dpr=Math.min(window.devicePixelRatio||1,2),W,H,img,buf,dirty=true;
const pal=[0xe6194b,0x3cb44b,0xffe119,0x4363d8,0xf58231,0x911eb4,0x46f0f0,0xf032e6,0xbcf60c,0xfabebe,0x008080,0xe6beff,0x9a6324,0xfffac8,0xaaffc3,0x808000,0xffd8b1,0x7f7fff,0xff7f7f,0x7fff7f];
const col=pal.map(c=>(255<<24)|((c&255)<<16)|(c&0xff00)|((c>>16)&255));
async function bin(u,T){return new T(await (await fetch(u)).arrayBuffer())}
async function load(){M=await (await fetch('meta.json')).json();XY=await bin('xy.bin',Float32Array);CL=await bin('cl.bin',Uint16Array);
NN=await bin('nn.bin',Int32Array);NM=await (await fetch('names.json')).json();N=CL.length;
document.title=M.title;document.getElementById('info').textContent=M.title+': '+N.toLocaleString()+' games';resize();fit();}
function resize(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;img=cx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);dirty=true}
function fit(){sc=Math.min(W,H)*0.9;ox=W/2;oy=H/2;dirty=true} // xy is scaled to -0.5..0.5 by the builder
const sx=i=>XY[2*i]*sc+ox, sy=i=>-XY[2*i+1]*sc+oy;
function draw(){if(!dirty||!N)return requestAnimationFrame(draw);dirty=false;buf.fill(0xff111111);
const r=sc>W*4?2:1;for(let i=0;i<N;i++){const x=sx(i)|0,y=sy(i)|0;if(x<0||y<0||x>=W-r||y>=H-r)continue;const c=col[CL[i]%col.length];
let p=y*W+x;buf[p]=c;if(r>1||NM[i][2]>=10){buf[p+1]=c;buf[p+W]=c;buf[p+W+1]=c}}
cx.putImageData(img,0,0);if(sel>=0){cx.strokeStyle='#fff';cx.lineWidth=2*dpr;for(let k=0;k<5;k++){const j=NN[sel*5+k];cx.beginPath();cx.moveTo(sx(sel),sy(sel));cx.lineTo(sx(j),sy(j));cx.stroke()}
cx.beginPath();cx.arc(sx(sel),sy(sel),8*dpr,0,7);cx.stroke()}requestAnimationFrame(draw)}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const link=i=>M.link?M.link.replace('{id}',NM[i][1]):'';
function show(i){sel=i;dirty=true;const c=document.getElementById('card');const n=NM[i];
let h='<b>'+esc(n[0])+'</b> '+(link(i)?'<a target="_blank" href="'+link(i)+'">store page</a>':'')+'<br><small>'+n[2]+' reviews, cluster '+CL[i]+(M.clusters&&M.clusters[CL[i]]?': '+esc(M.clusters[CL[i]]):'')+'</small><br>5 nearest:';
for(let k=0;k<5;k++){const j=NN[i*5+k];h+='<div class="nb" data-j="'+j+'">'+esc(NM[j][0])+'</div>'}c.innerHTML=h;c.style.display='block';
c.querySelectorAll('.nb').forEach(e=>e.onclick=()=>{const j=+e.dataset.j;ox+=W/2-sx(j);oy+=H/2-sy(j);show(j)})}
function pick(px,py){let b=-1,bd=(20*dpr)**2;for(let i=0;i<N;i++){const dx=sx(i)-px,dy=sy(i)-py,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i}}return b}
// pointer: pan with one finger, pinch with two, tap to select
const pts=new Map();let moved=false,pd0=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX*dpr,e.clientY*dpr]);moved=false;
if(pts.size==2){const [a,b]=[...pts.values()];pd0=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),x=e.clientX*dpr,y=e.clientY*dpr;
if(pts.size==1){if(Math.abs(x-p[0])+Math.abs(y-p[1])>2)moved=true;ox+=x-p[0];oy+=y-p[1]}
else if(pts.size==2){moved=true;pts.set(e.pointerId,[x,y]);const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
if(pd0){zoom(d/pd0,mx,my)}pd0=d;dirty=true;return}pts.set(e.pointerId,[x,y]);dirty=true});
cv.addEventListener('pointerup',e=>{const p=pts.get(e.pointerId);pts.delete(e.pointerId);if(pts.size<2)pd0=0;
if(!moved&&p){const i=pick(p[0],p[1]);if(i>=0)show(i);else{sel=-1;document.getElementById('card').style.display='none';dirty=true}}});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*0.002),e.clientX*dpr,e.clientY*dpr)},{passive:false});
function zoom(f,mx,my){sc*=f;ox=mx-(mx-ox)*f;oy=my-(my-oy)*f;dirty=true}
const q=document.getElementById('q'),hits=document.getElementById('hits');
q.oninput=()=>{const s=q.value.trim().toLowerCase();if(s.length<2){hits.style.display='none';return}
const r=[];for(let i=0;i<N&&r.length<30;i++)if(NM[i][0].toLowerCase().includes(s))r.push(i);r.sort((a,b)=>NM[b][2]-NM[a][2]);
hits.innerHTML=r.map(i=>'<div data-i="'+i+'">'+esc(NM[i][0])+' <small>('+NM[i][2]+')</small></div>').join('')||'<div>no match</div>';hits.style.display='block';
hits.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;hits.style.display='none';q.blur();const f=Math.max(1,W*3/sc);zoom(f,sx(i),sy(i));ox+=W/2-sx(i);oy+=H/2-sy(i);show(i)})};
addEventListener('resize',()=>{resize()});load().then(draw);
</script></body></html>
